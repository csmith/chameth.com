services:
  database:
    image: 'pgvector/pgvector:pg18'
    user: '1000'
    ports:
      - "127.0.0.1:15433:5432"
    environment:
      POSTGRES_PASSWORD: "devDB123123"
    volumes:
      - .postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
